<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#d8d8d5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242426" media="(prefers-color-scheme: dark)">
  <title>Entrar · Abul Converter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232b2b2e'/%3E%3Cpath d='M6 10v4m4-7v10m4-12v14m4-9v4' stroke='%23aa9cdb' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <header class="top shell">
    <h1 class="wordmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4"/><path d="M10 6v12"/><path d="M15 3v18"/><path d="M20 9v6"/></svg>Abul Converter</h1>
    <div class="header-tools">
      <label class="theme-control"><span class="visually-hidden">Tema</span><select id="theme" aria-label="Tema"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
    </div>
  </header>
  <main id="main" class="shell">
    <form class="seek login" id="login" novalidate>
      <h2 class="seek-label">Entre para continuar.</h2>
      <p class="seek-description">Do Spotify para sua coleção.</p>
      <div class="field"><label for="user">Usuário</label><input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="form-error" required></div>
      <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="form-error" required></div>
      <button id="enter" class="btn btn-primary" type="submit">Entrar</button>
      <p class="form-error" id="form-error" role="alert" hidden></p>
    </form>
  </main>
  <footer class="page-footer shell">Sua música, no seu ritmo.</footer>
</body>
</html>
